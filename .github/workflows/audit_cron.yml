name: Scheduled Repository Audit Agent

on:
  schedule:
    - cron: '0 0 * * *'  # تشغيل يومي عند منتصف الليل UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'معاينة فقط بدون إنشاء PRs أو تعليقات (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write
  issues: write

# منع تداخل نسختين من الجدولة اليومية.
concurrency:
  group: celia-audit-agent
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Agent
        env:
          # Personal Access Token (classic) بصلاحية repo، مخزّن في Secrets.
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.AGENT_GEMINI_API_KEY }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python agent.py
